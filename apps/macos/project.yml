name: Locked
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
targets:
  Locked:
    type: application
    platform: macOS
    sources: [Locked]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yagyaraj.locked
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        INFOPLIST_KEY_LSUIElement: YES
    scheme:
      testTargets: [LockedTests]
  # Tests compile the pure files directly, so they never launch the app.
  LockedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LockedTests
      - Locked/Policy.swift
      - Locked/Backdrop.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yagyaraj.locked.tests
