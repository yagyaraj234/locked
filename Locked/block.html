<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Locked</title>
<style>
  /* Always dark, like setup: the same near-black with the accent glowing from the top. */
  :root { color-scheme: dark; --tint: #0a84ff; }
  body { margin: 0; min-height: 100vh; box-sizing: border-box; padding: 32px;
         display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; text-align: center;
         font: 17px/1.4 -apple-system, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
         background: radial-gradient(circle 520px at 50% 0, color-mix(in srgb, var(--tint) 38%, transparent), transparent) #0d0f14; }
  main { grid-row: 2; display: grid; justify-items: center; animation: in 0.4s ease-out both; }
  svg { width: 34px; height: 34px; fill: var(--tint); margin-bottom: 28px; }
  p { margin: 0; color: rgb(255 255 255 / 0.55); }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
  h1 { margin: 0; max-width: 18ch; font-size: clamp(36px, 6vw, 64px); line-height: 1.05; letter-spacing: -0.02em;
       text-wrap: balance; overflow-wrap: anywhere; }
  footer { grid-row: 3; align-self: end; font-size: 14px; color: rgb(255 255 255 / 0.35); }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
<main>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5a5.5 5.5 0 0 0-5.5 5.5v3H6a2.5 2.5 0 0 0-2.5 2.5v7A2.5 2.5 0 0 0 6 22h12a2.5 2.5 0 0 0 2.5-2.5v-7A2.5 2.5 0 0 0 18 10h-.5V7A5.5 5.5 0 0 0 12 1.5Zm-3 8.5V7a3 3 0 0 1 6 0v3H9Z"/></svg>
  <p class="label">This site is locked</p>
  <h1 id="goal"></h1>
</main>
<footer>It opens again when your session ends.</footer>
<script>
  // The goal arrives percent-encoded in the fragment; textContent keeps it inert.
  document.getElementById("goal").textContent = decodeURIComponent(location.hash.slice(1)) || "Back to work";
</script>
