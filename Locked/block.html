<!doctype html>
<meta charset="utf-8">
<title>Locked</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; text-align: center;
         font: 17px -apple-system, system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 40px; margin: 0; }
  p { margin: 0; opacity: 0.6; }
</style>
<p>This site is locked. Your goal:</p>
<h1 id="goal"></h1>
<script>
  // The goal arrives percent-encoded in the fragment; textContent keeps it inert.
  document.getElementById("goal").textContent = decodeURIComponent(location.hash.slice(1)) || "Back to work";
</script>
